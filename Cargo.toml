[package]
name = "codeql-extractor-generator"
version = "0.1.0"
edition = "2021"

[dependencies]

codeql-extractor = { git = "https://github.com/GeekMasher/codeql", branch = "ts-extractor-escaping" }

# CLI
clap = { version = "4.0", features = ["derive", "env"] }
console = "0.15"
dialoguer = "0.11"
indicatif = "0.17"

anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

tokio = { version = "1.40", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
glob = "0.3"
chrono = { version = "0.4", features = ["serde"] }
liquid = "0.26"
walkdir = "2.5"
